name: Bug report / 問題回報
description: Something in MAD does not work as expected. / MAD 的行為不如預期。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste tokens, API keys or code you cannot share publicly. Report security vulnerabilities privately (see SECURITY.md).
        請勿貼上 token、API Key 或不能公開的程式碼。安全性漏洞請私下回報（見 SECURITY.md）。
  - type: input
    id: version
    attributes:
      label: MAD version / MAD 版本
      description: Help → About MAD, or the installer file name. / 說明 → 關於 MAD，或安裝檔的檔名。
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: clis
    attributes:
      label: Agent CLIs and versions / Agent CLI 與版本
      description: Output of `claude --version`, `codex --version`, `git --version` / 上述指令的輸出
      placeholder: "Claude Code 2.1.316, Codex CLI 0.166.0, git 2.51.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened / 發生什麼事
      description: Include the message MAD showed, if any. / 如果 MAD 有顯示訊息，請一併附上。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 預期的結果
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or other details / 截圖或其他資訊
      description: Check screenshots for project names, file contents or account details you do not want to publish. / 請先確認截圖裡沒有不想公開的專案名稱、檔案內容或帳號資訊。
