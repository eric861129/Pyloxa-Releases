name: Feature request / 功能建議
description: Suggest something MAD could do. / 建議 MAD 可以做的事。
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想完成什麼？
      description: Describe the situation, not only the feature. / 請描述你遇到的情況，而不只是想要的功能。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help / 怎麼做會有幫助
  - type: textarea
    id: workaround
    attributes:
      label: What you do today / 你現在怎麼處理
